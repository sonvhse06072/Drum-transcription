name: Real music meter diagnostics

on:
  push:
    branches: ["fix/meter-viterbi-offline"]
    paths:
      - "src/drum_transcription/rhythm.py"
      - "src/drum_transcription/meter_decoder.py"
      - "scripts/validate_room34_decoder.py"
      - ".github/workflows/real-meter-regression.yml"
  workflow_dispatch:

jobs:
  room34:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[beat]"
      - name: Explicitly prepare official Beat This model
        run: drum-transcription setup-models beat_this
      - name: Download CC0 audio and verify source bytes
        run: |
          mkdir -p data/room34
          curl -fL --retry 2 --connect-timeout 30 -o data/room34/source.ogg \
            "https://upload.wikimedia.org/wikipedia/commons/b/b6/Room_34_-_24_-_The_Fall_of_the_Village_of_the_Infinitesimal_Forest_at_the_Hands_of_the_Royal_Aggressor_An_Epic_in_Seven_Parts.ogg"
          echo "93b965383f397943d7526c7a150f3beff80ca42b544432659889a99f4defa4eb  data/room34/source.ogg" | sha256sum -c
      - name: Compare initial and globally decoded bar maps offline
        run: |
          OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python scripts/validate_room34_decoder.py \
            --audio data/room34/source.ogg \
            --checkpoint models/beat_this/final0.ckpt \
            --out data/room34/diagnostics.json --device cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room34-meter-diagnostics
          path: data/room34/diagnostics.json
          if-no-files-found: ignore
